services:
  api:
    build:
      context: .
      dockerfile: build/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=leaderboard_user
      - DB_PASSWORD=leaderboard_password
      - DB_NAME=leaderboard_db
      - REDIS_ADDR=redis:6379
      - APP_ENV=production
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy  
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: leaderboard_postgres
    environment:
      POSTGRES_USER: leaderboard_user
      POSTGRES_PASSWORD: leaderboard_password
      POSTGRES_DB: leaderboard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard_user -d leaderboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data: